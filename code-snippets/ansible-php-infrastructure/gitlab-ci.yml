# .gitlab-ci.yml
stages:
  - test
  - deploy

test:
  stage: test
  script:
    - composer install
    - php artisan test
  only:
    - branches

deploy_staging:
  stage: deploy
  script:
    - ansible-playbook -i inventories/staging/hosts playbooks/deploy.yml
  only:
    - develop
  environment:
    name: staging
    url: https://staging.myapp.com

deploy_production:
  stage: deploy
  script:
    - ansible-playbook -i inventories/production/hosts playbooks/deploy.yml
  only:
    - main
  environment:
    name: production
    url: https://myapp.com
  when: manual