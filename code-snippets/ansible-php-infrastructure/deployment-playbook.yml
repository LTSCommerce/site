# playbooks/deploy.yml
---
- name: Deploy PHP application
  hosts: webservers
  become: yes
  serial: "{{ deploy_serial | default(1) }}"
  vars:
    app_path: /var/www/{{ app_name }}
    release_path: "{{ app_path }}/releases/{{ ansible_date_time.epoch }}"
    current_path: "{{ app_path }}/current"
    shared_path: "{{ app_path }}/shared"
  tasks:
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      loop:
        - "{{ app_path }}"
        - "{{ app_path }}/releases"
        - "{{ shared_path }}"
        - "{{ shared_path }}/logs"
        - "{{ shared_path }}/uploads"

    - name: Clone application repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ release_path }}"
        version: "{{ app_version | default('main') }}"
        force: yes
      become_user: www-data

    - name: Install Composer dependencies
      composer:
        command: install
        working_dir: "{{ release_path }}"
        optimize_autoloader: yes
        no_dev: "{{ 'yes' if app_env == 'production' else 'no' }}"
      become_user: www-data

    - name: Create shared symlinks
      file:
        src: "{{ shared_path }}/{{ item }}"
        dest: "{{ release_path }}/{{ item }}"
        state: link
        force: yes
      loop:
        - logs
        - uploads
      become_user: www-data

    - name: Copy environment configuration
      template:
        src: .env.j2
        dest: "{{ release_path }}/.env"
        owner: www-data
        group: www-data
        mode: '0640'

    - name: Run database migrations
      shell: |
        cd {{ release_path }}
        php artisan migrate --force
      become_user: www-data
      when: run_migrations | default(false)

    - name: Clear application cache
      shell: |
        cd {{ release_path }}
        php artisan cache:clear
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
      become_user: www-data

    - name: Update current symlink
      file:
        src: "{{ release_path }}"
        dest: "{{ current_path }}"
        state: link
        force: yes
      notify: restart php-fpm

    - name: Set proper permissions
      file:
        path: "{{ current_path }}"
        owner: www-data
        group: www-data
        recurse: yes

    - name: Remove old releases
      shell: |
        cd {{ app_path }}/releases
        ls -1dt */ | tail -n +{{ keep_releases | default(5) }} | xargs rm -rf
      become_user: www-data