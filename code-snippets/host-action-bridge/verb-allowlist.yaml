# Closed allowlist mapping each verb to a single, fixed argv.
# The agent selects a verb by name; it never composes a command line,
# so there is no parameter to inject.

verbs:
  status:
    argv: ['/usr/bin/example-tool', 'compose', 'ps']
    read_only: true
    approval: auto

  logs:
    argv: ['/usr/bin/example-tool', 'compose', 'logs', '--tail=200']
    read_only: true
    approval: auto

  restart:
    argv: ['/usr/bin/example-tool', 'compose', 'restart']
    read_only: false
    approval: auto
    rate_limit: '5/hour'

  rebuild:
    argv: ['/usr/bin/example-tool', 'compose', 'up', '--build', '--force-recreate']
    read_only: false
    approval: manual
    rate_limit: '2/hour'
