# /etc/pve/corosync.conf
totem {
    version: 2
    secauth: on
    cluster_name: php-cluster
    transport: udpu
}

nodelist {
    node {
        ring0_addr: 192.168.1.10
        nodeid: 1
    }
    node {
        ring0_addr: 192.168.1.11
        nodeid: 2
    }
    node {
        ring0_addr: 192.168.1.12
        nodeid: 3
    }
}

quorum {
    provider: corosync_votequorum
    expected_votes: 3
}

logging {
    to_syslog: yes
}
